services: # Список сервісів (контейнерів), які працюють разом
  app: # Сервіс застосунку (бекенд / Node.js)
    build: # Інструкції для збірки Docker-образу
      context: . # Контекст збірки: поточна директорія (де лежить Dockerfile)
      # dockerfile: Dockerfile # Опціонально: явна назва Dockerfile, якщо вона нестандартна
    ports: # Проброс портів контейнера на хост
      - "5555:5001" # ХОСТ:КОНТЕЙНЕР -> http://localhost:5555 веде на порт 5001 всередині контейнера
    env_file: # Підвантаження змінних оточення з файлу(ів)
      - .env # Змінні для застосунку (наприклад, ключі, URL до БД тощо)
    volumes: # Монтування директорій/томів для синхронізації файлів
      - ./backend:/app # Локальна ./backend монтується в /app (зручно для розробки, live sync)
      - /app/node_modules # Анонімний том для node_modules, щоб не конфліктувати з хостом
    restart: on-failure # Автоматично перезапускати контейнер, якщо він впав з помилкою (non-zero exit)
    command: > # Перевизначення команди запуску контейнера
      sh -c "npm start" # Запуск npm start через shell (зручно для ланцюжків команд)

  db: # Сервіс бази даних (MongoDB)
    image: mongo # Офіційний образ MongoDB з Docker Hub
    ports: # Проброс порту MongoDB на хост (для Compass/CLI підключень)
      - "1234:27017" # ХОСТ:КОНТЕЙНЕР -> підключення: mongodb://localhost:1234
    env_file: # Змінні оточення для MongoDB
      - .env.db # Налаштування БД (наприклад, MONGO_INITDB_ROOT_USERNAME/PASSWORD)
    volumes: # Збереження даних + скрипти ініціалізації
      - ./mongo_db:/data/db # Персистентність даних на хості (дані не зникнуть після рестарту)
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro # Ініт-скрипт при першому старті (read-only)

  web: # Веб-сервер / reverse proxy (Nginx)
    image: nginx:alpine # Легкий образ Nginx на базі Alpine Linux
    ports: # Відкрити Nginx на хості
      - "80:80" # HTTP на 80 порту (http://localhost)
    volumes: # Монтування статичних файлів та конфігурації Nginx
      - ./client:/usr/share/nginx/html # Роздача статичного фронтенду з ./client
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Кастомний конфіг Nginx (роути/проксі/налаштування)
    # depends_on: # Опціонально: порядок запуску контейнерів (це НЕ перевірка готовності сервісів)
    #   - app
    #   - db